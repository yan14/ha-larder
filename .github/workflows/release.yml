name: Release

# Creates a GitHub release when the version in manifest.json is new – only after the workflow "Validate"
# (hassfest, HACS action, lint, tests) succeeded for that commit on main, as HACS requires.
# HACS shows releases as versions. The tag is v<version>.
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Create release if the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version custom_components/larder/manifest.json)
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            exit 0
          fi
          # own notes: the section "## <version>" of CHANGELOG.md; the generated notes (compare link) below it
          awk -v v="$version" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::No section for $version in CHANGELOG.md, using generated notes only."
          fi
          gh release create "$tag" \
            --target "$SHA" \
            --title "$tag" \
            --notes-file notes.md \
            --generate-notes \
            --latest
          echo "Created release $tag"
