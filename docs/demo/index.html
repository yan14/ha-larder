<!doctype html>
<!--
  Demo-Seite für die README-Screenshots: lädt das echte Panel mit erfundenen Daten.
  Aufruf: python -m http.server im Repo-Hauptverzeichnis, dann
  /docs/demo/index.html?lang=en|de&width=...
  &dialog=1|scan|nfc|fill|recipes  &view=estimates  &filter=soon  &tip=1
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --primary-color: #03a9f4; --primary-background-color: #fafafa; --card-background-color: #fff;
    --primary-text-color: #212121; --secondary-text-color: #727272; --divider-color: #e0e0e0;
    --app-header-background-color: #03a9f4; --app-header-text-color: #fff; --text-primary-color: #fff;
    --error-color: #db4437; --warning-color: #ffa600;
  }
  body { margin: 0; font-family: Roboto, "Helvetica Neue", Arial, sans-serif; }
</style>
</head>
<body>
<script type="module">
import { QR } from "./qr-data.js";
import "/custom_components/larder/frontend/larder-panel.js";

const q = new URLSearchParams(location.search);
const lang = q.get("lang") || "en";
const de = lang === "de";
const day = (n) => { const d = new Date(); d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const ago = (h) => new Date(Date.now() - h * 3600e3).toISOString();

const areas = de
  ? { kitchen: "Küche", cellar: "Keller", pantry: "Vorratskammer" }
  : { kitchen: "Kitchen", cellar: "Basement", pantry: "Pantry" };
const doses = de ? [
  ["Dose HA-K7M2PQ4X", "kitchen", "Tomatensuppe", 2, 20],
  ["Dose 34OL", "kitchen", "Hähnchen-Curry", 1, 52],
  ["Dose HA-9TQ3W6ZD", "kitchen", "Linsensuppe", null, 1],
  ["Nudeln", "pantry", "Penne", 180, 400],
  ["Reis", "pantry", "Basmati", 300, 700],
  ["Gemüsebrühe", "cellar", "Gemüsebrühe selbst gekocht", -2, 30],
  ["Bolognese", "cellar", "Bolognese-Sauce", 40, 96],
  ["Dose HA-5ZC8N1RB", "kitchen", "", null, null],
] : [
  ["Dose HA-K7M2PQ4X", "kitchen", "Tomato soup", 2, 20],
  ["Dose 34OL", "kitchen", "Chicken curry", 1, 52],
  ["Dose HA-9TQ3W6ZD", "kitchen", "Lentil soup", null, 1],
  ["Pasta", "pantry", "Penne", 180, 400],
  ["Rice", "pantry", "Basmati", 300, 700],
  ["Vegetable stock", "cellar", "Homemade vegetable stock", -2, 30],
  ["Bolognese", "cellar", "Bolognese sauce", 40, 96],
  ["Dose HA-5ZC8N1RB", "kitchen", "", null, null],
];
const entities = {}, devices = {}, states = {};
doses.forEach((d, i) => {
  const id = `demo${String(i).padStart(2, "0")}`;
  const [name, area, content, mhd, hoursAgo] = d;
  devices[id] = { id, name, name_by_user: null, area_id: area };
  const ids = { text: `text.${id}_c`, date: `date.${id}_b`, datetime: `datetime.${id}_f`, button: `button.${id}_e`, image: `image.${id}_q`, switch: `switch.${id}_v`, number: `number.${id}_p`, select: `select.${id}_u`, shopping: `switch.${id}_shopping` };
  for (const e of Object.values(ids)) entities[e] = { entity_id: e, device_id: id, platform: "larder" };
  const has = content !== "";
  states[ids.text] = { entity_id: ids.text, state: has ? content : "", attributes: {} };
  states[ids.date] = { entity_id: ids.date, state: has && mhd !== null ? day(mhd) : "unknown", attributes: { estimates: true } };
  states[ids.switch] = { entity_id: ids.switch, state: name === "Rice" || name === "Reis" ? "off" : "on", attributes: {} };
  states[ids.shopping] = { entity_id: ids.shopping, state: [0, 2, 5].includes(i) ? "on" : "off", attributes: { list: "todo.shopping_list" } };
  states[ids.datetime] = { entity_id: ids.datetime, state: has && hoursAgo !== null ? ago(hoursAgo) : "unknown", attributes: {} };
  const portions = { 0: 4, 1: 2, 2: 5, 5: 3, 6: 6 }[i] || 0;
  const unitOf = { 2: "slices" }[i] || "portions";
  states[ids.number] = { entity_id: ids.number, state: has ? String(portions) : "0", attributes: {} };
  states[ids.select] = { entity_id: ids.select, state: unitOf, attributes: { options: ["portions", "pieces", "slices", "grams", "milliliters"] } };
  states[ids.button] = { entity_id: ids.button, state: "unknown", attributes: {} };
  states[ids.image] = { entity_id: ids.image, state: "x", attributes: { entity_picture: QR[i] } };
});
const hass = {
  entities, devices, states, language: lang, user: { is_admin: true },
  areas: Object.fromEntries(Object.entries(areas).map(([k, v]) => [k, { area_id: k, name: v }])),
  services: { ai_task: { generate_data: {} }, larder: { suggest_recipes: {} } },
  auth: { external: { config: { canWriteTag: true }, fireMessage() {} } },
  hassUrl: (p) => p, callService() {}, callApi: async () => ({}),
  callWS: async (msg) => {
    if (msg.type === "larder/nfc_tags") return { links: {}, by_device: { demo00: "tag-a", demo01: "tag-b", demo03: "tag-c" } };
    if (msg.type === "larder/contents") return { contents: de
      ? ["Pizza", "Pizzateig", "Gulasch", "Linsensuppe", "Tomatensuppe", "Hähnchen-Curry"]
      : ["Pizza", "Pizza dough", "Goulash", "Lentil soup", "Tomato soup", "Chicken curry"] };
    if (msg.type === "call_service" && msg.service === "suggest_recipes") return { response: { count: 3, recipes: de ? [
      { title: "Hähnchen-Curry-Wrap", minutes: 20, uses: ["Hähnchen-Curry", "Penne"], extra_ingredients: ["Wraps", "Joghurt"], steps: ["Curry erhitzen und in Wraps füllen.", "Mit Joghurt und frischen Kräutern servieren."] },
      { title: "Tomaten-Linsen-Eintopf", minutes: 25, uses: ["Tomatensuppe", "Linsensuppe"], extra_ingredients: ["Zwiebel", "Olivenöl"], steps: ["Zwiebel anbraten, beide Suppen dazugeben.", "10 Minuten köcheln lassen und abschmecken."] },
    ] : [
      { title: "Chicken curry wraps", minutes: 20, uses: ["Chicken curry", "Penne"], extra_ingredients: ["Wraps", "Yoghurt"], steps: ["Heat the curry and fill it into wraps.", "Serve with yoghurt and fresh herbs."] },
      { title: "Tomato and lentil stew", minutes: 25, uses: ["Tomato soup", "Lentil soup"], extra_ingredients: ["Onion", "Olive oil"], steps: ["Fry the onion, add both soups.", "Simmer for 10 minutes and season."] },
    ] } };
    if (msg.type === "larder/estimates") return { mode: "table_ai", entries: ENTRIES };
    return {};
  },
};
const ENTRIES = de ? [
  { key: "a", content: "Tomatensuppe", area: "Kühlschrank", vacuum: true, days: 3, tip: "Gut durcherhitzen", source: "table", origin: null },
  { key: "b", content: "Hähnchen-Curry", area: "Kühlschrank", vacuum: true, days: 4, tip: "Innerhalb von 2 Stunden abkühlen", source: "table", origin: "table" },
  { key: "c", content: "Gulasch", area: "Gefrierschrank", vacuum: true, days: 180, tip: "Portionsweise einfrieren", source: "learned", origin: "ai" },
  { key: "d", content: "Selbstgebackenes Brot", area: "Vorratskammer", vacuum: false, days: 4, tip: "In Leinen aufbewahren", source: "ai", origin: null },
  { key: "e", content: "Basmati", area: "Vorratskammer", vacuum: true, days: 730, tip: "", source: "table", origin: null },
] : [
  { key: "a", content: "Tomato soup", area: "Fridge", vacuum: true, days: 3, tip: "Heat through thoroughly", source: "table", origin: null },
  { key: "b", content: "Chicken curry", area: "Fridge", vacuum: true, days: 4, tip: "Cool within 2 hours", source: "table", origin: "table" },
  { key: "c", content: "Goulash", area: "Freezer", vacuum: true, days: 180, tip: "Freeze in portions", source: "learned", origin: "ai" },
  { key: "d", content: "Homemade bread", area: "Pantry", vacuum: false, days: 4, tip: "Store in linen", source: "ai", origin: null },
  { key: "e", content: "Basmati", area: "Pantry", vacuum: true, days: 730, tip: "", source: "table", origin: null },
];

const width = Number(q.get("width") || 1100);
document.body.style.width = width + "px";
const el = document.createElement("larder-panel");
document.body.appendChild(el);
el.hass = hass;
if (q.get("dialog") === "1") el.openAddDialog();
if (q.get("dialog") === "nfc") {
  el.openAddDialog();
  const r = el.shadowRoot.querySelector('input[name="mode"][value="nfc"]');
  r.checked = true;
  r.dispatchEvent(new Event("change"));
  el.shadowRoot.querySelector('[data-f="name"]').value = de ? "Gulasch" : "Goulash";
}
if (q.get("dialog") === "fill") {
  el.openFillDialog("demo07");
  const f = (n) => el.shadowRoot.querySelector(`form.fillform [data-f="${n}"]`);
  f("content").value = de ? "Pizza" : "Pizza";
}
if (q.get("dialog") === "recipes") {
  el.openRecipeDialog();
  el.shadowRoot.querySelector('form.recipeform [data-f="servings"]').value = "2";
  el.submitRecipes();
}
if (q.get("view") === "estimates") el.setView("estimates");
if (q.get("filter")) { el._opts.filter = q.get("filter"); el._update(); }
if (q.get("tip") === "1") {
  const card = el._cards.get("demo02");
  card._setTip(de ? "Geschätzt: ca. 3 Tage haltbar (Tabelle). Gut durcherhitzen" : "Estimated: about 3 days shelf life (table). Heat through thoroughly");
}
if (q.get("dialog") === "scan") {
  // Wie nach einem Scan über den Kurzbefehl: Dialog mit vorbelegtem Zwilling-Code
  el.openAddDialog("zwilling://zwillingapp/food-storage/in/?tc=42ML30&s=m&cc=6KP2");
  el.shadowRoot.querySelector('[data-f="name"]').value = de ? "Linsensuppe" : "Lentil soup";
  const sel = el.shadowRoot.querySelector(".dialog select");
  sel.value = "pantry";
}
</script>
</body>
</html>
