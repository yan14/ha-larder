estimate_best_before:
  target:
    entity:
      integration: zwilling_storage
      domain: date
  fields:
    apply:
      required: false
      default: true
      selector:
        boolean:
    overwrite:
      required: false
      default: false
      selector:
        boolean:
clear_best_before:
  target:
    entity:
      integration: zwilling_storage
      domain: date
clear_filled_at:
  target:
    entity:
      integration: zwilling_storage
      domain: datetime
get_expiring:
  fields:
    days:
      required: false
      default: 3
      selector:
        number:
          min: 0
          max: 365
          mode: box
    include_expired:
      required: false
      default: true
      selector:
        boolean:
mark_opened:
  target:
    entity:
      integration: zwilling_storage
      domain: date
  fields:
    days:
      required: false
      selector:
        number:
          min: 1
          max: 365
          mode: box
