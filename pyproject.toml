# Linter (ruff), läuft in der CI (Workflow "Validate"). Lokal: ruff check .
[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = [
    "E501",  # Zeilenlänge: lange Texte und Testdaten bleiben lesbar in einer Zeile
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["homeassistant"]
